tool_controller_node:
  ros__parameters:
    topic: "/robot_cmd"
    publish_rate: 100.0

    # mode can be: constant, triangle, sinusoid
    # value is ignored when mode is sinusoid/triangle
    # min, max, frequency are ingnored when mode is constant

    # dof: depends on control mode. roll/pitch/yaw/aperture or roll_shaft, benf, rool_tip, aperture

    dof1:
      mode: "constant"
      min: -1.57
      max: 1.57
      frequency: 0.5
      value: 0.0

    dof2:
      mode: "constant"
      value: 0.5
      min: -0.7     
      max: 0.7   
      frequency: 0.5 

    dof3:
      mode: "constant"
      min: -1.57
      max: 1.57
      frequency: 0.5
      value: 0.0

    dof4:
      mode: "sinusoid"
      value: 0.0
      min: 0.0 
      max: 0.3
      frequency: 0.2